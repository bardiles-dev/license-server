services:
  license-server:
    image: license-server-ts:1.0
    container_name: license-server
    restart: unless-stopped
    ports:
      - "9900:9000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/license_server.db
      - PUBLIC_PEM_PATH=/app/config/public.pem
    volumes:
      - license-server-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64M

volumes:
  license-server-data:
