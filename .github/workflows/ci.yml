# CI: build, lint, code quality, Trivy, secret scanning, dependency/DAST reports, supply chain
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ------------------------------ Build verification
  build-verify:
    name: Build verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [license-server, license-authority]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r ${{ matrix.project }}/requirements.txt

      - name: Verify import
        run: |
          cd ${{ matrix.project }}
          python -c "from app.main import app; print('OK')"
        continue-on-error: true

  # ------------------------------ Code quality (lint + format)
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check (license-server)
        run: ruff check license-server/app --output-format=github
        continue-on-error: true

      - name: Ruff check (license-authority)
        run: ruff check license-authority/app --output-format=github
        continue-on-error: true

      - name: Ruff format check
        run: ruff format --check license-server/app license-authority/app
        continue-on-error: true

  # ------------------------------ Secret scanning
  # secret-scan:
  #   name: Secret scanning
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0

  #     - name: Gitleaks scan
  #       uses: gitleaks/gitleaks-action@v2
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #       continue-on-error: true

  # ------------------------------ Trivy (vulnerabilities + misconfig)
  trivy-repo:
    name: Trivy (repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy repo scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"
        continue-on-error: true

  trivy-deps:
    name: Trivy (dependencies)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [license-server, license-authority]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: pip install -r ${{ matrix.project }}/requirements.txt

      - name: Trivy fs (installed packages)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH"
        continue-on-error: true

  # ------------------------------ Trivy container (imagen Docker license-server)
  trivy-container:
    name: Trivy (container license-server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build license-server image
        run: docker build -t license-server:ci ./license-server

      - name: Trivy image scan (vulnerabilities)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "license-server:ci"
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"
        continue-on-error: true

  # ------------------------------ Supply chain security
  supply-chain:
    name: Supply chain security
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        continue-on-error: true

  # Análisis de vulnerabilidades en dependencias (Python / PyPI)
  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [license-server, license-authority]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r ${{ matrix.project }}/requirements.txt

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r ${{ matrix.project }}/requirements.txt --format=json --output=audit-${{ matrix.project }}.json || true
          pip-audit -r ${{ matrix.project }}/requirements.txt || true
        continue-on-error: true

  # OWASP Dependency-Check (CVE/NVD para dependencias)
  owasp-dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create reports dir
        run: mkdir -p reports

      - name: Run OWASP Dependency-Check
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/src \
            -v "${{ github.workspace }}/reports":/reports \
            owasp/dependency-check:latest \
            --scan /src \
            --project "license-server-ts" \
            --format JSON \
            --out /reports \
            --enablePython \
            --failOnCVSS 9
        continue-on-error: true

      - name: Dependency-Check summary (logs + Step Summary)
        if: always()
        run: |
          echo "### OWASP Dependency-Check (resumen)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/dependency-check-report.json ]; then
            cat <<'PY' | python
            import json
            from pathlib import Path

            p = Path("reports/dependency-check-report.json")
            data = json.loads(p.read_text(encoding="utf-8"))

            deps = data.get("dependencies") or []
            vulns = []
            for d in deps:
                for v in (d.get("vulnerabilities") or []):
                    vulns.append({
                        "name": v.get("name") or v.get("source") or "-",
                        "severity": v.get("severity") or "-",
                        "cvss": (v.get("cvssv3", {}) or {}).get("baseScore") or (v.get("cvssv2", {}) or {}).get("score"),
                        "fileName": d.get("fileName") or "-",
                    })

            sev_order = {"CRITICAL": 4, "HIGH": 3, "MEDIUM": 2, "LOW": 1}
            vulns_sorted = sorted(
                vulns,
                key=lambda x: (sev_order.get(str(x["severity"]).upper(), 0), x["cvss"] or 0),
                reverse=True,
            )
            top = vulns_sorted[:30]

            counts = {}
            for v in vulns:
                k = str(v["severity"]).upper()
                counts[k] = counts.get(k, 0) + 1

            print("Dependency-Check vulns:", counts)

            md = []
            md.append("**Conteo**: " + ", ".join(
                f"{k}={counts[k]}" for k in sorted(counts.keys(), key=lambda k: sev_order.get(k, 0), reverse=True)
            ))
            if top:
                md.append("")
                md.append("**Top vulnerabilidades (máx 30)**:")
                for v in top:
                    sev = str(v["severity"]).upper()
                    score = v["cvss"]
                    score_txt = f" (CVSS {score})" if score is not None else ""
                    md.append(f"- `{sev}` {v['name']}{score_txt} — `{v['fileName']}`")

            Path("depcheck-summary.md").write_text("\n".join(md) + "\n", encoding="utf-8")
            PY
            cat depcheck-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**No se generó** `reports/dependency-check-report.json` (revisa logs del step anterior)." >> "$GITHUB_STEP_SUMMARY"
            echo "No se encontró reports/dependency-check-report.json"
            ls -la reports || true
          fi

  # SonarCloud (calidad de código + seguridad)
  # sonarcloud:
  #   name: SonarCloud
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0

  #     - name: Set up Python
  #       uses: actions/setup-python@v5
  #       with:
  #         python-version: ${{ env.PYTHON_VERSION }}

  #     - name: Install dependencies (both projects)
  #       run: |
  #         pip install -r license-server/requirements.txt
  #         pip install -r license-authority/requirements.txt

  #     - name: SonarCloud Scan
  #       uses: SonarSource/sonarcloud-github-action@master
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  #       continue-on-error: true

  # SAST: Bandit (análisis estático de seguridad Python)
  sast-bandit:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit (license-server)
        run: bandit -r license-server/app -f json -o bandit-server.json || true
        continue-on-error: true

      - name: Run Bandit (license-authority)
        run: bandit -r license-authority/app -f json -o bandit-authority.json || true
        continue-on-error: true

      - name: Run Bandit (report)
        run: |
          bandit -r license-server/app -ll
          bandit -r license-authority/app -ll

  # DAST: OWASP ZAP baseline + reporte HTML
  dast-zap:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install license-server deps
        run: pip install -r license-server/requirements.txt

      - name: Start license-server (background)
        run: |
          cd license-server && python -m uvicorn app.main:app --host 127.0.0.1 --port 9000 &
          sleep 15
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9000/ || true

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://127.0.0.1:9000"
          # No crear issues ni artifacts (solo logs/summary)
          allow_issue_writing: false
          fail_action: false
          # Opciones extra del baseline (no fallar por warnings y dar salida útil)
          cmd_options: "-a -I"
        continue-on-error: true

      - name: Create reports dir
        run: mkdir -p reports

      - name: ZAP full scan (HTML + JSON)
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/reports":/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t http://127.0.0.1:9000 \
            -r /zap/wrk/zap-report.html \
            -J /zap/wrk/zap-report.json \
            -I
        continue-on-error: true

      - name: ZAP report summary (logs + Step Summary)
        if: always()
        run: |
          echo "### OWASP ZAP (resumen)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/zap-report.json ]; then
            cat <<'PY' | python
            import json
            from pathlib import Path

            p = Path("reports/zap-report.json")
            data = json.loads(p.read_text(encoding="utf-8"))
            site = (data.get("site") or [{}])[0]
            alerts = site.get("alerts") or []

            def sev_rank(risk):
                return {"Informational": 0, "Low": 1, "Medium": 2, "High": 3}.get(risk, -1)

            alerts_sorted = sorted(
                alerts,
                key=lambda a: sev_rank(a.get("riskdesc", "").split(" ")[0]),
                reverse=True,
            )
            top = alerts_sorted[:20]

            counts = {"High": 0, "Medium": 0, "Low": 0, "Informational": 0, "Other": 0}
            for a in alerts:
                key = (a.get("riskdesc") or "").split(" ")[0]
                if key in counts:
                    counts[key] += 1
                else:
                    counts["Other"] += 1

            print("ZAP alerts:", counts)
            print("\nTop alerts:")
            for a in top:
                risk = (a.get("riskdesc") or "").split(" ")[0]
                name = a.get("name") or "-"
                url = (a.get("instances") or [{}])[0].get("uri") if a.get("instances") else None
                print(f"- [{risk}] {name}" + (f" ({url})" if url else ""))

            md_lines = []
            md_lines.append("**Conteo**: " + ", ".join(f"{k}={v}" for k, v in counts.items() if v))
            if top:
                md_lines.append("")
                md_lines.append("**Top alertas (máx 20)**:")
                for a in top:
                    risk = (a.get("riskdesc") or "").split(" ")[0]
                    name = a.get("name") or "-"
                    url = (a.get("instances") or [{}])[0].get("uri") if a.get("instances") else ""
                    md_lines.append(f"- `{risk}` {name}" + (f" — `{url}`" if url else ""))

            Path("zap-summary.md").write_text("\n".join(md_lines) + "\n", encoding="utf-8")
            PY
            cat zap-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**No se generó** `reports/zap-report.json` (revisa logs del step anterior)." >> "$GITHUB_STEP_SUMMARY"
            echo "No se encontró reports/zap-report.json"
            ls -la reports || true
          fi

